<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能标题生成器</title>
    <style>
        * {
            margin:  0;
            padding: 0;
            box-sizing:  border-box;
        }
        
        body {
            font-family:  'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background:  linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width:  800px;
            width:  100%;
        }
        
        h1 {
            text-align: center;
            color:  #333;
            margin-bottom: 10px;
            font-size:  32px;
        }
        
        .subtitle {
            text-align: center;
            color:  #666;
            margin-bottom: 30px;
            font-size:  14px;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 10px;
            color: #555;
            font-weight: 600;
        }
        
        textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            font-family:  inherit;
            resize: vertical;
            min-height: 150px;
            transition: border-color 0.3s;
        }
        
        textarea: focus {
            outline: none;
            border-color: #667eea;
        }
        
        .char-count {
            text-align: right;
            color: #999;
            font-size: 12px;
            margin-top: 5px;
        }
        
        .button-group {
            display: flex;
            gap:  10px;
            margin-bottom: 20px;
        }
        
        button {
            flex: 1;
            padding:  15px;
            border:  none;
            border-radius:  10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        . btn-generate {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-generate:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn-generate:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        . btn-clear {
            background:  #f5f5f5;
            color: #666;
        }
        
        .btn-clear:hover {
            background: #e0e0e0;
        }
        
        .result-box {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-bottom:  20px;
            display:  none;
        }
        
        .result-box.show {
            display: block;
            animation: fadeIn 0.5s;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform:  translateY(-10px); }
            to { opacity:  1; transform: translateY(0); }
        }
        
        .result-label {
            color: #667eea;
            font-weight: 600;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
        }
        
        .result-label:: before {
            content: "📌";
            margin-right: 8px;
            font-size: 20px;
        }
        
        .result-text {
            font-size: 20px;
            color: #333;
            line-height: 1.6;
            word-break: break-all;
        }
        
        .error-box {
            background: #ffe6e6;
            border-left: 4px solid #ff4444;
            padding: 15px;
            border-radius: 5px;
            margin-bottom:  20px;
            display: none;
        }
        
        .error-box. show {
            display: block;
            animation: shake 0.5s;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        
        .error-text {
            color: #cc0000;
        }
        
        .loading {
            text-align: center;
            color: #667eea;
            display:  none;
        }
        
        .loading.show {
            display: block;
        }
        
        .loading:: after {
            content: "... ";
            animation: dots 1.5s infinite;
        }
        
        @keyframes dots {
            0%, 20% { content: ". "; }
            40% { content: ".."; }
            60%, 100% { content: "..."; }
        }
        
        . examples {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
        }
        
        . examples h3 {
            color:   #555;
            margin-bottom: 15px;
            font-size: 16px;
        }
        
        . example-item {
            background:  #f8f9fa;
            padding:  10px 15px;
            margin-bottom:  10px;
            border-radius: 8px;
            cursor: pointer;
            transition:  all 0.3s;
            font-size: 14px;
            color: #666;
        }
        
        . example-item:hover {
            background: #e9ecef;
            transform: translateX(5px);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 智能标题生成器</h1>
        <p class="subtitle">基于 mT5 预训练模型 · 快速生成精准标题</p>
        
        <div class="error-box" id="errorBox">
            <div class="error-text" id="errorText"></div>
        </div>
        
        <div class="input-group">
            <label for="inputText">输入文本内容：</label>
            <textarea 
                id="inputText" 
                placeholder="请输入需要生成标题的文本内容... &#10;&#10;例如：新华社北京消息，国务院总理今天在人民大会堂会见了来访的德国总理，双方就中德关系和共同关心的国际问题交换了意见。"
                maxlength="1000"
            ></textarea>
            <div class="char-count">
                <span id="charCount">0</span> / 1000
            </div>
        </div>
        
        <div class="button-group">
            <button class="btn-generate" id="generateBtn" onclick="generateTitle()">
                ✨ 生成标题
            </button>
            <button class="btn-clear" onclick="clearAll()">
                🗑️ 清空
            </button>
        </div>
        
        <div class="loading" id="loading">正在生成标题</div>
        
        <div class="result-box" id="resultBox">
            <div class="result-label">生成的标题：</div>
            <div class="result-text" id="resultText"></div>
        </div>
        
        <div class="examples">
            <h3>💡 示例文本（点击使用）：</h3>
            <div class="example-item" onclick="useExample(0)">
                新华社北京消息，国务院总理李克强今天在人民大会堂会见了来访的德国总理默克尔，双方就中德关系和共同关心的国际问题交换了意见。
            </div>
            <div class="example-item" onclick="useExample(1)">
                科学家们最新研究发现，经常喝绿茶可以降低患心脏病的风险，这是因为绿茶中含有丰富的抗氧化物质，能够有效保护心血管健康。
            </div>
            <div class="example-item" onclick="useExample(2)">
                苹果公司今天发布了全新的iPhone 15系列手机，采用了更先进的A17芯片，摄像头性能大幅提升，售价从5999元起。
            </div>
        </div>
    </div>
    
    <script>
        const examples = [
            "新华社北京消息，国务院总理李克强今天在人民大会堂会见了来访的德国总理默克尔，双方就中德关系和共同关心的国际问题交换了意见。",
            "科学家们最新研究发现，经常喝绿茶可以降低患心脏病的风险，这是因为绿茶中含有丰富的抗氧化物质，能够有效保护心血管健康。",
            "苹果公司今天发布了全新的iPhone 15系列手机，采用了更先进的A17芯片，摄像头性能大幅提升，售价从5999元起。"
        ];
        
        const inputText = document.getElementById('inputText');
        const charCount = document.getElementById('charCount');
        const generateBtn = document.getElementById('generateBtn');
        const loading = document.getElementById('loading');
        const resultBox = document.getElementById('resultBox');
        const resultText = document. getElementById('resultText');
        const errorBox = document.getElementById('errorBox');
        const errorText = document.getElementById('errorText');
        
        // Character counting
        inputText.addEventListener('input', function() {
            charCount.textContent = this.value. length;
        });
        
        // Use example
        function useExample(index) {
            inputText.value = examples[index];
            charCount.textContent = examples[index].length;
            hideError();
            hideResult();
        }
        
        // Generate title
        async function generateTitle() {
            const text = inputText.value.trim();
            
            if (!text) {
                showError('请输入文本内容');
                return;
            }
            
            hideError();
            hideResult();
            showLoading();
            
            try {
                const response = await fetch('/generate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ text: text })
                });
                
                const data = await response.json();
                
                hideLoading();
                
                if (response.ok) {
                    showResult(data.title);
                } else {
                    showError(data.error || '生成失败，请重试');
                }
            } catch (error) {
                hideLoading();
                showError('网络错误，请检查连接');
            }
        }
        
        // Clear all
        function clearAll() {
            inputText.value = '';
            charCount.textContent = '0';
            hideError();
            hideResult();
        }
        
        // Show loading
        function showLoading() {
            loading.classList.add('show');
            generateBtn.disabled = true;
        }
        
        // Hide loading
        function hideLoading() {
            loading.classList. remove('show');
            generateBtn.disabled = false;
        }
        
        // Show result
        function showResult(title) {
            resultText.textContent = title;
            resultBox.classList.add('show');
        }
        
        // Hide result
        function hideResult() {
            resultBox.classList.remove('show');
        }
        
        // Show error
        function showError(message) {
            errorText.textContent = message;
            errorBox.classList.add('show');
            setTimeout(() => hideError(), 3000);
        }
        
        // Hide error
        function hideError() {
            errorBox.classList.remove('show');
        }
        
        // Support Enter key to generate
        inputText.addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === 'Enter') {
                generateTitle();
            }
        });
    </script>
</body>
</html>
